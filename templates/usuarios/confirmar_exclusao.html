{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-danger text-white py-3">
                    <h5 class="mb-0"><i class="bi bi-exclamation-triangle-fill me-2"></i>Excluir Usuário</h5>
                </div>
                <div class="card-body p-4 text-center">
                    <i class="bi bi-person-x text-danger" style="font-size:3rem;"></i>
                    <p class="mt-3 mb-1">Tem certeza que deseja excluir permanentemente o usuário:</p>
                    <p class="fw-bold fs-5 text-danger">{{ usuario.username }}</p>
                    {% if usuario.get_full_name %}
                    <p class="text-muted small">{{ usuario.get_full_name }}</p>
                    {% endif %}
                    <p class="text-muted small">Esta ação não pode ser desfeita.</p>
                    <div class="d-flex gap-2 justify-content-center mt-4">
                        <a href="{% url 'cal:listar_usuarios' %}" class="btn btn-outline-secondary px-4">
                            <i class="bi bi-arrow-left me-1"></i>Cancelar
                        </a>
                        <form method="post">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-danger px-4">
                                <i class="bi bi-trash me-1"></i>Excluir
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
