{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h2>Especialidades</h2>
    <a href="{% url 'cal:especialidade_create' %}" class="btn btn-primary mb-3">Nova Especialidade</a>
    <table class="table">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            {% for esp in page_obj %}
            <tr>
                <td>{{ esp.nome }}</td>
                <td>
                    <a href="{% url 'cal:especialidade_update' esp.pk %}" class="btn btn-sm btn-warning">Editar</a>
                    <a href="{% url 'cal:especialidade_delete' esp.pk %}" class="btn btn-sm btn-danger">Excluir</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
