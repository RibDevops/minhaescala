{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h2>Excluir Especialidade</h2>
    <p>Tem certeza que deseja excluir a especialidade "{{ especialidade.nome }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Confirmar Exclusão</button>
        <a href="{% url 'cal:especialidade_list' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
