{% extends 'base.html' %}

        <div class="col-md-6 text-center">
            <div class="card shadow">
                <div class="card-body py-5">
                    <i class="bi bi-check-circle text-success" style="font-size: 3rem;"></i>
                    <h2 class="mt-3">Você saiu com sucesso!</h2>
                    <p class="text-muted">Obrigado por utilizar o sistema Minha Escala.</p>

            </div>
        </div>
    </div>
</div>
{% endblock %}
