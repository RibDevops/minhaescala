{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mt-4">
    <div class="card shadow-sm border-0 rounded-4">
        <div class="card-header bg-primary text-white py-3">
            <h4 class="mb-0 fw-bold"><i class="bi bi-calendar-plus"></i> Registrar Escala</h4>
        </div>
        <div class="card-body p-4">
            <form id="bulkPlantaoForm" method="post">
                {% csrf_token %}
                
                <!-- Seleção do Profissional (Única para todos os plantões do lote) -->
                <div class="row mb-4">
                    <div class="col-md-12">
                        <label class="form-label fw-bold">Profissional</label>
                        <select name="enfermeiro" class="form-select form-select-lg" required>
                            <option value="">Selecione o Enfermeiro</option>
                            {% for e in enfermeiros %}
                            <option value="{{ e.id }}" {% if object.profissional.id == e.id %}selected{% endif %}>{{ e.nome_exibicao }} ({{ e.matricula }})</option>
                            {% endfor %}
                        </select>
                        <div class="form-text">Selecione o profissional uma vez e adicione vários plantões abaixo.</div>
                    </div>
                </div>

                <hr class="my-4 opacity-25">

                <!-- Área dos Cards de Plantão -->
                <div id="plantaoCards" class="row g-3">
                    <!-- Primeiro Card (Padrão) -->
                    <div class="col-md-6 col-xl-4 plantao-item">
                        <div class="card h-100 border border-light shadow-sm">
                            <div class="card-header bg-light d-flex justify-content-between align-items-center">
                                <span class="fw-bold text-muted small">Plantão #1</span>
                                <button type="button" class="btn btn-sm btn-outline-danger border-0 remove-card d-none">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </div>
                                <div class="mb-3">
                                    <label class="form-label small fw-bold">Data</label>
                                    <input type="date" name="data[]" class="form-control data-input" value="{{ object.data|date:'Y-m-d' }}" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small fw-bold">Tipo</label>
                                    <select name="tipo_plantao[]" class="form-select tipo-input" required>
                                        <option value="">Selecione...</option>
                                        {% for t in tipos_plantao %}
                                        <option value="{{ t.id }}" {% if object.tipo.id == t.id %}selected{% endif %}>{{ t.codigo }} - {{ t.descricao }} ({{ t.horas }}h)</option>
                                        {% endfor %}
                                    </select>
                                </div>
                                <div class="carga-aviso mb-2" style="display: none;"></div>
                                <div>
                                    <label class="form-label small fw-bold">Observações</label>
                                    <textarea name="observacoes[]" class="form-control" rows="1">{{ object.observacao }}</textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Botão Adicionar Mais -->
                {% if not is_edit %}
                <div class="mt-4 text-center">
                    <button type="button" id="btnAddPlantao" class="btn btn-outline-primary rounded-pill px-4">
                        <i class="bi bi-plus-circle"></i> + Plantão
                    </button>
                </div>
                {% endif %}

                <div class="mt-5 border-top pt-4">
                    <div class="d-flex justify-content-end gap-2">
                        <a href="{% url 'cal:calendar' %}" class="btn btn-light px-4">Cancelar</a>
                        <button type="submit" class="btn btn-primary px-5">{% if is_edit %}Salvar Alterações{% else %}Salvar Todos os Plantões{% endif %}</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<template id="plantaoTemplate">
    <div class="col-md-6 col-xl-4 plantao-item">
        <div class="card h-100 border border-light shadow-sm">
            <div class="card-header bg-light d-flex justify-content-between align-items-center">
                <span class="fw-bold text-muted small">Plantão</span>
                <button type="button" class="btn btn-sm btn-outline-danger border-0 remove-card">
                    <i class="bi bi-trash"></i>
                </button>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label small fw-bold">Data</label>
                    <input type="date" name="data[]" class="form-control data-input" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold">Tipo</label>
                    <select name="tipo_plantao[]" class="form-select tipo-input" required>
                        <option value="">Selecione...</option>
                        {% for t in tipos_plantao %}
                        <option value="{{ t.id }}">{{ t.codigo }} - {{ t.descricao }} ({{ t.horas }}h)</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="carga-aviso mb-2" style="display: none;"></div>
                <div>
                    <label class="form-label small fw-bold">Observações</label>
                    <textarea name="observacoes[]" class="form-control" rows="1"></textarea>
                </div>
            </div>
        </div>
    </div>
</template>

<style>
    .plantao-item { transition: all 0.3s ease; }
    .card:hover { transform: translateY(-2px); transition: transform 0.2s; }
    .form-select-lg { font-size: 1.1rem; }
    .btn-outline-primary:hover { background-color: #f8fbff; color: #0d6efd; }
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const container = document.getElementById('plantaoCards');
    const btnAdd = document.getElementById('btnAddPlantao');
    const template = document.getElementById('plantaoTemplate');

    function updateCounters() {
        const cards = container.querySelectorAll('.plantao-item');
        cards.forEach((card, index) => {
            card.querySelector('.fw-bold.text-muted.small').textContent = `Plantão #${index + 1}`;
            const removeBtn = card.querySelector('.remove-card');
            if (cards.length > 1) {
                removeBtn.classList.remove('d-none');
            } else {
                removeBtn.classList.add('d-none');
            }
        });
    }

    btnAdd.addEventListener('click', function() {
        const clone = template.content.cloneNode(true);
        container.appendChild(clone);
        updateCounters();
    });

    container.addEventListener('click', function(e) {
        if (e.target.closest('.remove-card')) {
            const item = e.target.closest('.plantao-item');
            if (container.querySelectorAll('.plantao-item').length > 1) {
                item.remove();
                updateCounters();
            }
        }
    });

    updateCounters();

    // Validação de carga horária via AJAX
    function validarCarga(element) {
        const item = element.closest('.plantao-item');
        if (!item) return;
        const enfermeiroId = document.querySelector('select[name="enfermeiro"]').value;
        const dataInput = item.querySelector('.data-input');
        const tipoInput = item.querySelector('.tipo-input');
        const avisoDiv = item.querySelector('.carga-aviso');

        if (enfermeiroId && dataInput && dataInput.value && tipoInput && tipoInput.value) {
            fetch(`/api/validar-carga/?enfermeiro=${enfermeiroId}&data=${dataInput.value}&tipo=${tipoInput.value}`)
                .then(response => response.json())
                .then(data => {
                    if (data.excedeu) {
                        avisoDiv.innerHTML = `<div class="alert alert-warning py-1 px-2 mb-0" style="font-size: 0.8rem;">
                            <i class="bi bi-exclamation-triangle"></i> ${data.mensagem}
                        </div>`;
                        avisoDiv.style.display = 'block';
                    } else {
                        avisoDiv.style.display = 'none';
                    }
                })
                .catch(err => console.error('Erro na validação:', err));
        } else if (avisoDiv) {
            avisoDiv.style.display = 'none';
        }
    }

    container.addEventListener('change', function(e) {
        if (e.target.classList.contains('data-input') || e.target.classList.contains('tipo-input')) {
            validarCarga(e.target);
        }
    });

    const enfermeiroSelect = document.querySelector('select[name="enfermeiro"]');
    if (enfermeiroSelect) {
        enfermeiroSelect.addEventListener('change', function() {
            container.querySelectorAll('.plantao-item').forEach(item => {
                const dataInput = item.querySelector('.data-input');
                if (dataInput && dataInput.value) validarCarga(dataInput);
            });
        });
    }

    if (btnAdd) {
        btnAdd.addEventListener('click', function() {
            const clone = template.content.cloneNode(true);
            container.appendChild(clone);
            updateCounters();
        });
    }

{% endblock %}
