{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-danger">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0">Excluir Matrícula</h4>
                </div>
                <div class="card-body">
                    <p>Tem certeza que deseja excluir a matrícula de <strong>{{ matricula.nome_completo }}</strong>?</p>
                    <p class="text-muted small">Esta ação não poderá ser desfeita e removerá o vínculo com o usuário e perfil.</p>
                </div>
                <div class="card-footer bg-white d-flex justify-content-end">
                    <form method="post">
                        {% csrf_token %}
                        <a href="{% url 'cal:matricula_detail' matricula.pk %}" class="btn btn-outline-secondary me-2">Cancelar</a>
                        <button type="submit" class="btn btn-danger">Confirmar Exclusão</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
