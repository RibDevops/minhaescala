{% extends 'cal/crud_base_list.html' %}
{% block table_rows %}
<td>
    <div class="rounded-circle" style="width: 25px; height: 25px; background-color: {{ obj.cor }}; border: 1px solid #dee2e6;" title="{{ obj.cor }}"></div>
</td>
<td class="fw-bold">{{ obj.codigo }}</td>
<td>{{ obj.descricao|default:"-" }}</td>
<td>{{ obj.horas }}h</td>
{% endblock %}

{% block extra_actions %}
<a href="{% url 'cal:tipoevento_update' obj.id %}" class="btn btn-sm btn-outline-primary" title="Editar">
    <i class="bi bi-pencil"></i> Editar
</a>
<a href="{% url 'cal:tipoevento_delete' obj.id %}" class="btn btn-sm btn-outline-danger" title="Excluir">
    <i class="bi bi-trash"></i> Excluir
</a>
{% endblock %}
