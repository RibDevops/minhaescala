{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <div class="card shadow-sm border-0 rounded-4">
        <div class="card-header bg-danger text-white py-3">
            <h4 class="mb-0 fw-bold"><i class="bi bi-exclamation-triangle"></i> {{ titulo }}</h4>
        </div>
        <div class="card-body p-4 text-center">
            <p class="lead mb-4">Tem certeza que deseja excluir <strong>{{ object }}</strong>?</p>
            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-3">
                    <a href="{{ cancel_url }}" class="btn btn-light px-4">Cancelar</a>
                    <button type="submit" class="btn btn-danger px-4">Confirmar Exclusão</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
