{% extends 'base.html' %}
{% load static %}

{% block title %}Calendário{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <a href="?month={{ mes_anterior }}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-chevron-left"></i> Anterior
        </a>
        <h4 class="mb-0 text-primary">{{ primeiro_dia|date:"F Y"|capfirst }}</h4>
        <a href="?month={{ mes_seguinte }}" class="btn btn-outline-secondary btn-sm">
            Próximo <i class="bi bi-chevron-right"></i>
        </a>
    </div>

    <div class="card shadow-sm border-0 rounded-3">
        <div class="card-body p-0">
            <div class="table-responsive p-3">
                {{ calendar }}
            </div>
        </div>
    </div>
    
    <div class="mt-4 text-center">
        <a href="{% url 'cal:event_new' %}" class="btn btn-primary px-4 rounded-pill shadow">
            <i class="bi bi-plus-lg"></i> Novo Plantão
        </a>
    </div>
</div>

<!-- Modal de Evento do Calendário -->
<div class="modal fade" id="modalEvento" tabindex="-1">
    <div class="modal-dialog modal-sm">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-calendar-event"></i> Plantão</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p class="mb-1"><strong>Profissional:</strong> <span id="modalNome"></span></p>
                <p class="mb-1"><strong>Tipo:</strong> <span id="modalCodigo"></span></p>
                <p class="mb-1"><strong>Carga:</strong> <span id="modalHoras"></span>h</p>
                <p class="mb-0"><strong>Data:</strong> <span id="modalData"></span></p>
            </div>
            <div class="modal-footer justify-content-between">
                <button type="button" class="btn btn-danger btn-sm" id="btnDeletarCalendario" onclick="deletarEventoCalendario()">
                    <i class="bi bi-trash"></i> Deletar
                </button>
                <a id="btnEditarCalendario" href="#" class="btn btn-primary btn-sm">
                    <i class="bi bi-pencil"></i> Editar
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let eventoIdAtual = null;
    let modalEvento = null;

    function initializeModal() {
        if (typeof bootstrap !== 'undefined' && !modalEvento) {
            modalEvento = new bootstrap.Modal(document.getElementById('modalEvento'));
        }
    }

    function abrirModalEvento(eventoId, nome, codigo, horas, data) {
        initializeModal();
        if (!modalEvento) return;
        
        eventoIdAtual = eventoId;
        document.getElementById('modalNome').textContent = nome;
        document.getElementById('modalCodigo').textContent = codigo;
        document.getElementById('modalHoras').textContent = horas;
        document.getElementById('modalData').textContent = data;
        document.getElementById('btnEditarCalendario').href = `/plantao/${eventoId}/editar/`;
        modalEvento.show();
    }

    function deletarEventoCalendario() {
        if (!confirm('Tem certeza que deseja deletar este plantão?')) return;
        fetch(`/plantao/${eventoIdAtual}/excluir/`, {
            method: 'POST',
            headers: {
                'X-CSRFToken': '{{ csrf_token }}',
                'Content-Type': 'application/json'
            }
        })
        .then(response => {
            if (response.redirected || response.ok) {
                if (modalEvento) modalEvento.hide();
                location.reload();
            } else {
                alert('Erro ao deletar o plantão.');
            }
        })
        .catch(() => {
            // Fallback: redireciona para a página de exclusão
            window.location.href = `/plantao/${eventoIdAtual}/excluir/`;
        });
    }

    // Initialize modal when DOM is ready and Bootstrap is loaded
    document.addEventListener('DOMContentLoaded', initializeModal);
</script>
{% endblock %}
